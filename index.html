<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Reactive Planar Grid</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background-color: #111; /* Match scene background */
        }
        #gridCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* Style dat.gui */
        .dg.main {
             /* Position GUI top-right */
             top: 10px !important;
             right: 10px !important;
             left: auto !important;
        }
        /* Hide the actual file inputs visually */
        #audioInput, #videoInput {
            width: 0.1px;
            height: 0.1px;
            opacity: 0;
            overflow: hidden;
            position: absolute;
            z-index: -1;
        }
    </style>
</head>
<body>
    <!-- Hidden video element for camera input -->
    <video id="webcamFeed" playsinline autoplay muted style="display:none; position: absolute; top: 0; left: 0;"></video>

    <!-- Hidden file inputs, triggered by GUI buttons -->
    <input type="file" id="audioInput" accept="audio/*">
    <input type="file" id="videoInput" accept="video/*"> <!-- Added video input -->

    <canvas id="gridCanvas"></canvas>

    <!-- Load main script as module -->
    <script type="module" src="js/main.js"></script>

</body>
</html>
